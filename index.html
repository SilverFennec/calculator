<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="display">
    <input readonly value="9876">
  </div>
  <div class="numpad">
    <div class="numRow1">
      <button >7</button>
      <button >8</button>
      <button >9</button>
    </div>
    <div class="numRow2">
      <button>4</button>
      <button>5</button>
      <button>6</button>
    </div>
    <div class="numRow3">
      <button>1</button>
      <button>2</button>
      <button>3</button>
    </div>
    <div class="numRow4">
      <button>0</button>
      <button>.</button>
    </div>
  </div>
  
  <div class="operators">
    <button class="divideButton">÷</button>
    <button class="multipleButton">×</button>
    <button class="subtractButton">-</button>
    <button class="addButton">+</button>
    <button class="equalsButton">=</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
