<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="display">
    <input readonly class="displayInput" value="">
  </div>
  <div class="clear">
    <button>C</button>
  </div>
  <div class="numpad">
    <div class="numRow1">
      <button value="7">7</button>
      <button value="8">8</button>
      <button value="9">9</button>
    </div>
    <div class="numRow2">
      <button value="4">4</button>
      <button value="5">5</button>
      <button value="6">6</button>
    </div>
    <div class="numRow3">
      <button value="1">1</button>
      <button value="2">2</button>
      <button value="3">3</button>
    </div>
    <div class="numRow4">
      <button value="0">0</button>
      <button value=".">.</button>
    </div>
  </div>
  
  <div class="operators">
    <button value="/" class="divideButton">÷</button>
    <button value="*" class="multipleButton">×</button>
    <button value="-" class="subtractButton">-</button>
    <button value="+" class="addButton">+</button>
    <button value="=" class="equalsButton">=</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
